# rayround CI: every pull request and every push to master checks the formatting, runs the
# test suite on the VM and as native binaries (with the raylang release pinned in ray.toml,
# .github/actions/setup-ray), and runs ray-elements' checker over the page.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No sound card or display on the runners: a real-time null audio sink (the session
  # clock still runs) and a headless UI.
  RAY_AUDIO_SINK: "null"
  RAY_UI_BACKEND: headless

jobs:
  format:
    name: ray fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: x86_64-unknown-linux-gnu
      # `ray fmt` prints the canonical version: any difference is an unformatted file.
      - name: Check that every source is formatted
        shell: bash
        run: |
          status=0
          for f in src/*.ray tests/*.ray scripts/*.ray; do
            if ! ray fmt "$f" | diff -u "$f" - >/dev/null; then
              echo "::error file=$f::not formatted (run: ray fmt -w $f)"
              status=1
            fi
          done
          exit $status

  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14,      target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: ${{ matrix.target }}
      - name: Fetch the dependencies
        run: ray fetch
      - name: Tests (VM)
        run: ray test
      # The app ships native: the suite also runs compiled.
      - name: Tests (native)
        run: ray test --native

  page:
    name: page (ray-elements checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `ray fetch` links node_modules/@raylang/elements to the fetched package.
      - name: Fetch the dependencies
        run: ray fetch
      - name: Check the page
        run: make check-page
